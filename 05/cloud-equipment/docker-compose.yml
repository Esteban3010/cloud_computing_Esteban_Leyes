services:
  api:
    image: 515129079082.dkr.ecr.us-east-1.amazonaws.com/equipment-api:8.0
    container_name: equipment-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: equipment
      DB_USER: equipment
      DB_PASSWORD: change-me
      S3_BUCKET: equipment-documents-esteban-2026
      AWS_REGION: us-east-1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: equipment-db
    environment:
      POSTGRES_DB: equipment
      POSTGRES_USER: equipment
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipment -d equipment"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: equipment-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
